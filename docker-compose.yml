# Notebook recomputation service.
#
#   docker compose up --build
#   open http://localhost:8000/docs
#
services:
  recalc:
    build: .
    image: recalc-service:latest
    ports:
      - "8000:8000"
    # Reap orphaned kernel / compute grandchildren (zombies reparented
    # to PID 1) so batch process groups always drain completely.
    init: true
    environment:
      RECALC_TIMEOUT_SEC: "60"   # hard wall-clock limit per batch
      RECALC_MAX_PARALLEL: "2"   # concurrency slots; submissions beyond are rejected (429)
      RECALC_WORK_DIR: /tmp/recalc_batches
    restart: unless-stopped
